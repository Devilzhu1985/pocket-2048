name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      sign:
        description: Sign with the configured private release key
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore signing key
        if: inputs.sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pocket2048.p12"
          chmod 600 "$RUNNER_TEMP/pocket2048.p12"
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ inputs.sign && format('{0}/pocket2048.p12', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon
      - name: Verify release signature
        if: inputs.sign
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk'
      - name: Prepare APK
        run: |
          mkdir output
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk output/Pocket-2048.apk
          else
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk output/Pocket-2048-unsigned.apk
          fi
          cd output
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Pocket-2048-Android
          path: output/
          retention-days: 30
      - name: Remove temporary key
        if: always() && inputs.sign
        run: rm -f "$RUNNER_TEMP/pocket2048.p12"
